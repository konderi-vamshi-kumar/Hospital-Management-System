spring.application.name=hospital-management-api
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:sqlite:./hospital-management.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.sql.init.mode=always

server.port=8080

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

app.bootstrap-super-admin.username=${SUPER_ADMIN_USERNAME:}
app.bootstrap-super-admin.password=${SUPER_ADMIN_PASSWORD:}
